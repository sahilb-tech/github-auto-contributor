name: Daily Activity

on:
  schedule:
    - cron: "30 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure Git
        run: |
          git config user.name "sahilb-tech"
          git config user.email "sahilbankar.tech@gamil.com"

      - name: Run activity bot
        run: python bot.py

      - name: Push changes
        run: git push
